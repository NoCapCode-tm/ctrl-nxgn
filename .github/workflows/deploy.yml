name: Deploy Admin Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits instead of cancelling an active deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Guard against a stray public/index.html
        run: |
          if [ -f public/index.html ]; then
            echo "::error file=public/index.html::Delete public/index.html. Vite copies it into dist and overwrites the built page."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.nexgn.cloud/api/v1/' }}
          VITE_APP_ENV: production
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Verify the build output
        run: |
          for f in \
            dist/index.html \
            dist/404.html \
            dist/CNAME \
            dist/favicon/favicon.ico \
            dist/favicon/manifest.json \
            dist/brand/auth-bg.webp \
            dist/brand/logo.svg; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done

          # Strip Windows CRLF before checking CNAME so line endings never break CI
          test "$(tr -d '\r\n' < dist/CNAME)" = "ctrl.nexgn.cloud" || {
            echo "::error::dist/CNAME must contain ctrl.nexgn.cloud"
            exit 1
          }

          grep -q "/assets/" dist/index.html || {
            echo "::error::dist/index.html is not the built page"
            exit 1
          }

          echo "Build output for admin.nexgn.cloud looks good"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4